<rect class="shape ext-container" x="345" y="70" width="250" height="81" rx="8"/><text x="470" y="95" class="node-name" text-anchor="middle">Dashboard</text><text x="470" y="111" class="node-tech" text-anchor="middle">[Container: Svelte]</text><text x="470" y="130" class="node-desc" text-anchor="middle">Starts, stops and steers a team</text>
<rect class="shape component" x="344.6666666666667" y="376" width="250" height="111" rx="8"/><text x="469.6666666666667" y="401" class="node-name on-component" text-anchor="middle">FleetDaemon</text><text x="469.6666666666667" y="417" class="node-tech on-component" text-anchor="middle">[Component: fleet/daemon.py]</text><text x="469.6666666666667" y="436" class="node-desc on-component" text-anchor="middle">One asyncio task and one satay</text><text x="469.6666666666667" y="451" class="node-desc on-component" text-anchor="middle">engine per project. Resumes</text><text x="469.6666666666667" y="466" class="node-desc on-component" text-anchor="middle">unfinished teams after a crash.</text>
<rect class="shape component" x="344.6666666666667" y="561" width="250" height="111" rx="8"/><text x="469.6666666666667" y="586" class="node-name on-component" text-anchor="middle">Team and workflow</text><text x="469.6666666666667" y="602" class="node-tech on-component" text-anchor="middle">[Component: team.py, workflow.py]</text><text x="469.6666666666667" y="621" class="node-desc on-component" text-anchor="middle">The satay workflows run_task and</text><text x="469.6666666666667" y="636" class="node-desc on-component" text-anchor="middle">run_team. Roles run concurrently</text><text x="469.6666666666667" y="651" class="node-desc on-component" text-anchor="middle">under one task id.</text>
<rect class="shape component" x="303" y="732" width="250" height="126" rx="8"/><text x="428" y="757" class="node-name on-component" text-anchor="middle">Working memory</text><text x="428" y="773" class="node-tech on-component" text-anchor="middle">[Component: handover.py, limits.py,</text><text x="428" y="788" class="node-tech on-component" text-anchor="middle">budget.py, llm/]</text><text x="428" y="807" class="node-desc on-component" text-anchor="middle">Token budget check, handover</text><text x="428" y="822" class="node-desc on-component" text-anchor="middle">summaries, turn caps and the</text><text x="428" y="837" class="node-desc on-component" text-anchor="middle">per-role spend stop.</text>
<rect class="shape component" x="912" y="743.25" width="250" height="111" rx="8"/><text x="1037" y="768.25" class="node-name on-component" text-anchor="middle">Satay tasks</text><text x="1037" y="784.25" class="node-tech on-component" text-anchor="middle">[Component: tasks/]</text><text x="1037" y="803.25" class="node-desc on-component" text-anchor="middle">The three places effects happen:</text><text x="1037" y="818.25" class="node-desc on-component" text-anchor="middle">delegate (a side effect), journal</text><text x="1037" y="833.25" class="node-desc on-component" text-anchor="middle">append, own LLM call.</text>
<rect class="shape component" x="507" y="939.5" width="250" height="111" rx="8"/><text x="632" y="964.5" class="node-name on-component" text-anchor="middle">AgentBackend seam</text><text x="632" y="980.5" class="node-tech on-component" text-anchor="middle">[Component: agents/]</text><text x="632" y="999.5" class="node-desc on-component" text-anchor="middle">Protocol and registry. Each backend</text><text x="632" y="1014.5" class="node-desc on-component" text-anchor="middle">turns its tool's output into a</text><text x="632" y="1029.5" class="node-desc on-component" text-anchor="middle">DelegationOutcome.</text>
<rect class="shape component" x="548.6666666666667" y="1519" width="250" height="111" rx="8"/><text x="673.6666666666667" y="1544" class="node-name on-component" text-anchor="middle">Episodic store</text><text x="673.6666666666667" y="1560" class="node-tech on-component" text-anchor="middle">[Component: episodic/]</text><text x="673.6666666666667" y="1579" class="node-desc on-component" text-anchor="middle">Tagged-union events, secrets</text><text x="673.6666666666667" y="1594" class="node-desc on-component" text-anchor="middle">redacted at write time,</text><text x="673.6666666666667" y="1609" class="node-desc on-component" text-anchor="middle">append-only.</text>
<rect class="shape component" x="1087" y="932" width="250" height="126" rx="8"/><text x="1212" y="957" class="node-name on-component" text-anchor="middle">Secrets and broker</text><text x="1212" y="973" class="node-tech on-component" text-anchor="middle">[Component: secrets/, broker.py]</text><text x="1212" y="992" class="node-desc on-component" text-anchor="middle">Resolves a secret inside the</text><text x="1212" y="1007" class="node-desc on-component" text-anchor="middle">delegation task. With the broker</text><text x="1212" y="1022" class="node-desc on-component" text-anchor="middle">on, leases a short-lived token</text><text x="1212" y="1037" class="node-desc on-component" text-anchor="middle">instead of the model key.</text>
<rect class="shape component" x="507" y="1118" width="250" height="126" rx="8"/><text x="632" y="1143" class="node-name on-component" text-anchor="middle">Backend transports</text><text x="632" y="1159" class="node-tech on-component" text-anchor="middle">[Component: delegate/]</text><text x="632" y="1178" class="node-desc on-component" text-anchor="middle">kopicode serve or print, Claude</text><text x="632" y="1193" class="node-desc on-component" text-anchor="middle">Code stream-json or print, Codex</text><text x="632" y="1208" class="node-desc on-component" text-anchor="middle">app-server or exec. Live ones can</text><text x="632" y="1223" class="node-desc on-component" text-anchor="middle">pause for an answer.</text>
<rect class="shape component" x="507" y="1304" width="250" height="141" rx="8"/><text x="632" y="1329" class="node-name on-component" text-anchor="middle">Permissions and Needs you</text><text x="632" y="1345" class="node-tech on-component" text-anchor="middle">[Component: permissions.py,</text><text x="632" y="1360" class="node-tech on-component" text-anchor="middle">requests.py,</text><text x="632" y="1375" class="node-tech on-component" text-anchor="middle">delegate/never_allowed.py]</text><text x="632" y="1394" class="node-desc on-component" text-anchor="middle">Modes, per-role access and the</text><text x="632" y="1409" class="node-desc on-component" text-anchor="middle">shared never-allowed list. A</text><text x="632" y="1424" class="node-desc on-component" text-anchor="middle">request is two journal events.</text>
<rect class="shape component" x="777" y="1304" width="250" height="96" rx="8"/><text x="902" y="1329" class="node-name on-component" text-anchor="middle">Sandbox providers</text><text x="902" y="1345" class="node-tech on-component" text-anchor="middle">[Component: sandbox/]</text><text x="902" y="1364" class="node-desc on-component" text-anchor="middle">Container and E2B providers behind</text><text x="902" y="1379" class="node-desc on-component" text-anchor="middle">one interface.</text>
<rect class="shape ext" x="314" y="1831" width="250" height="81" rx="8"/><text x="439" y="1856" class="node-name" text-anchor="middle">Coding agent CLIs</text><text x="439" y="1872" class="node-tech" text-anchor="middle">[Software System]</text><text x="439" y="1891" class="node-desc" text-anchor="middle">kopicode, Claude Code, Codex</text>
<rect class="shape ext" x="30" y="1831" width="250" height="81" rx="8"/><text x="155" y="1856" class="node-name" text-anchor="middle">Summarising model</text><text x="155" y="1872" class="node-tech" text-anchor="middle">[Software System]</text><text x="155" y="1891" class="node-desc" text-anchor="middle">OpenRouter or Anthropic</text>
<path class="shape ext-db" d="M598 1840 a98 9 0 0 1 196 0 v78 a98 9 0 0 1 -196 0 z"/><path class="shape-line" d="M598 1840 a98 9 0 0 0 196 0"/><text x="696" y="1864" class="node-name" text-anchor="middle">Episodic journal</text><text x="696" y="1880" class="node-tech" text-anchor="middle">[Container: SQLite]</text><text x="696" y="1899" class="node-desc" text-anchor="middle">&lt;root&gt;/.cuttlefish/episodic</text><text x="696" y="1914" class="node-desc" text-anchor="middle">.db</text>
<path class="shape ext-db" d="M1114 1840 a98 9 0 0 1 196 0 v78 a98 9 0 0 1 -196 0 z"/><path class="shape-line" d="M1114 1840 a98 9 0 0 0 196 0"/><text x="1212" y="1864" class="node-name" text-anchor="middle">Secrets store</text><text x="1212" y="1880" class="node-tech" text-anchor="middle">[Container: SQLite,</text><text x="1212" y="1895" class="node-tech" text-anchor="middle">encrypted]</text><text x="1212" y="1914" class="node-desc" text-anchor="middle">~/.cuttlefish/secrets.db</text>
<rect class="elabel-bg" x="292" y="221" width="174" height="34" rx="3"/>
<text x="379" y="234" class="elabel" text-anchor="middle">start, stop, steer, approve</text>
<text x="379" y="248" class="elabel-tech" text-anchor="middle">[HTTP]</text>
<rect class="elabel-bg" x="335.6666666666667" y="507" width="132" height="34" rx="3"/>
<text x="401.6666666666667" y="520" class="elabel" text-anchor="middle">Starts through satay</text>
<text x="401.6666666666667" y="534" class="elabel-tech" text-anchor="middle">[run_app]</text>
<rect class="elabel-bg" x="234" y="692" width="192" height="20" rx="3"/>
<text x="330" y="705" class="elabel" text-anchor="middle">Checks budget, hands over with</text>
<rect class="elabel-bg" x="1040" y="692" width="42" height="20" rx="3"/>
<text x="1061" y="705" class="elabel" text-anchor="middle">Calls</text>
<rect class="elabel-bg" x="516" y="885" width="114" height="20" rx="3"/>
<text x="573" y="898" class="elabel" text-anchor="middle">Delegates through</text>
<rect class="elabel-bg" x="516" y="1078" width="114" height="20" rx="3"/>
<text x="573" y="1091" class="elabel" text-anchor="middle">Uses the selected</text>
<rect class="elabel-bg" x="309" y="1727" width="126" height="34" rx="3"/>
<text x="372" y="1740" class="elabel" text-anchor="middle">Spawns and talks to</text>
<text x="372" y="1754" class="elabel-tech" text-anchor="middle">[stdio]</text>
<rect class="elabel-bg" x="480" y="1264" width="150" height="20" rx="3"/>
<text x="555" y="1277" class="elabel" text-anchor="middle">Asks for an answer from</text>
<rect class="elabel-bg" x="762" y="1264" width="138" height="20" rx="3"/>
<text x="831" y="1277" class="elabel" text-anchor="middle">Runs inside, when set</text>
<rect class="elabel-bg" x="891" y="1171" width="144" height="20" rx="3"/>
<text x="963" y="1184" class="elabel" text-anchor="middle">Appends events through</text>
<rect class="elabel-bg" x="1048" y="878" width="162" height="34" rx="3"/>
<text x="1129" y="891" class="elabel" text-anchor="middle">Resolves inside the task;</text>
<text x="1129" y="905" class="elabel" text-anchor="middle">never returns the value</text>
<rect class="elabel-bg" x="450" y="1465" width="180" height="34" rx="3"/>
<text x="540" y="1478" class="elabel" text-anchor="middle">Records requests and answers</text>
<text x="540" y="1492" class="elabel" text-anchor="middle">in</text>
<rect class="elabel-bg" x="610" y="1727" width="60" height="34" rx="3"/>
<text x="640" y="1740" class="elabel" text-anchor="middle">Writes</text>
<text x="640" y="1754" class="elabel-tech" text-anchor="middle">[SQLite]</text>
<rect class="elabel-bg" x="1148" y="1727" width="60" height="34" rx="3"/>
<text x="1178" y="1740" class="elabel" text-anchor="middle">Reads</text>
<text x="1178" y="1754" class="elabel-tech" text-anchor="middle">[SQLite]</text>
<rect class="elabel-bg" x="49" y="1727" width="102" height="34" rx="3"/>
<text x="100" y="1740" class="elabel" text-anchor="middle">Summarises with</text>
<text x="100" y="1754" class="elabel-tech" text-anchor="middle">[HTTPS]</text>
<rect class="shape component" x="30" y="1969" width="22" height="13" rx="3"/><text x="59" y="1979" class="legend-t" text-anchor="start">Component</text><rect class="shape ext" x="137.7" y="1969" width="22" height="13" rx="3"/><text x="166.7" y="1979" class="legend-t" text-anchor="start">Outside the system</text><rect class="boundary" x="302.09999999999997" y="1969" width="22" height="13" rx="3"/><text x="331.09999999999997" y="1979" class="legend-t" text-anchor="start">Boundary</text>
<text x="30" y="2005" class="note" text-anchor="start">A project secret's decrypted value is never a satay task argument or return value (ADR-0006). A satay control call made by the daemon itself goes through asyncio.to_thread, because both share one event loop (ADR-0009).</text>
</svg>
