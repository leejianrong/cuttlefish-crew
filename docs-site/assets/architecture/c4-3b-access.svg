<path class="edge" d="M1304.6666666666667 941 L1304.6666666666667 974 Q1304.6666666666667 981 1297.6666666666667 981 L855 981 Q848 981 848 988 L848 1031" marker-end="url(#arrow)"/>
<path class="edge" d="M848 1157 L848 1217" marker-end="url(#arrow)"/>
<rect class="shape person" x="1287" y="325" width="250" height="81" rx="8"/><text x="1412" y="350" class="node-name" text-anchor="middle">Operator</text><text x="1412" y="366" class="node-tech" text-anchor="middle">[Person]</text><text x="1412" y="385" class="node-desc" text-anchor="middle">PC dashboard</text>
<rect class="shape ext-container" x="1003" y="70" width="250" height="81" rx="8"/><text x="1128" y="95" class="node-name" text-anchor="middle">Paired browser</text><text x="1128" y="111" class="node-tech" text-anchor="middle">[Container: Dashboard on a phone]</text><text x="1128" y="130" class="node-desc" text-anchor="middle">Holds its own device key</text>
<rect class="shape ext-container" x="1003" y="325" width="250" height="81" rx="8"/><text x="1128" y="350" class="node-name" text-anchor="middle">Relay</text><text x="1128" y="366" class="node-tech" text-anchor="middle">[Container: FastAPI]</text><text x="1128" y="385" class="node-desc" text-anchor="middle">Passes encrypted bytes</text>
<rect class="shape ext-container" x="1571" y="325" width="250" height="81" rx="8"/><text x="1696" y="350" class="node-name" text-anchor="middle">Agent session</text><text x="1696" y="366" class="node-tech" text-anchor="middle">[Container: tmux, claude]</text><text x="1696" y="385" class="node-desc" text-anchor="middle">Runs the hook script</text>
<rect class="shape component" x="1138" y="830" width="250" height="111" rx="8"/><text x="1263" y="855" class="node-name on-component" text-anchor="middle">HTTP surface</text><text x="1263" y="871" class="node-tech on-component" text-anchor="middle">[Component: fleet/server.py]</text><text x="1263" y="890" class="node-desc on-component" text-anchor="middle">Projects, requests, devices,</text><text x="1263" y="905" class="node-desc on-component" text-anchor="middle">secrets, artifacts, the terminal</text><text x="1263" y="920" class="node-desc on-component" text-anchor="middle">websocket and the hook route.</text>
<rect class="shape component" x="453" y="1031" width="250" height="126" rx="8"/><text x="578" y="1056" class="node-name on-component" text-anchor="middle">Auth guards</text><text x="578" y="1072" class="node-tech on-component" text-anchor="middle">[Component: fleet/auth.py,</text><text x="578" y="1087" class="node-tech on-component" text-anchor="middle">serve_token.py]</text><text x="578" y="1106" class="node-desc on-component" text-anchor="middle">Loopback token, or password</text><text x="578" y="1121" class="node-desc on-component" text-anchor="middle">sessions that slide forward while</text><text x="578" y="1136" class="node-desc on-component" text-anchor="middle">used. Chosen by the bind.</text>
<rect class="shape component" x="1221.3333333333335" y="1031" width="250" height="126" rx="8"/><text x="1346.3333333333335" y="1056" class="node-name on-component" text-anchor="middle">Relay link</text><text x="1346.3333333333335" y="1072" class="node-tech on-component" text-anchor="middle">[Component: fleet/relay_link.py]</text><text x="1346.3333333333335" y="1091" class="node-desc on-component" text-anchor="middle">The daemon's relay key, pairing,</text><text x="1346.3333333333335" y="1106" class="node-desc on-component" text-anchor="middle">and the guard that applies a</text><text x="1346.3333333333335" y="1121" class="node-desc on-component" text-anchor="middle">device's tier. The third security</text><text x="1346.3333333333335" y="1136" class="node-desc on-component" text-anchor="middle">check.</text>
<rect class="shape component" x="1003" y="645" width="250" height="111" rx="8"/><text x="1128" y="670" class="node-name on-component" text-anchor="middle">Relay connector</text><text x="1128" y="686" class="node-tech on-component" text-anchor="middle">[Component: relay/connector.py]</text><text x="1128" y="705" class="node-desc on-component" text-anchor="middle">Dials out, runs a Noise handshake</text><text x="1128" y="720" class="node-desc on-component" text-anchor="middle">per browser, calls the daemon's own</text><text x="1128" y="735" class="node-desc on-component" text-anchor="middle">app in process.</text>
<rect class="shape component" x="1263" y="1217" width="250" height="111" rx="8"/><text x="1388" y="1242" class="node-name on-component" text-anchor="middle">Tiers</text><text x="1388" y="1258" class="node-tech on-component" text-anchor="middle">[Component: fleet/tiers.py]</text><text x="1388" y="1277" class="node-desc on-component" text-anchor="middle">What each paired device may do, per</text><text x="1388" y="1292" class="node-desc on-component" text-anchor="middle">route. A route with no tier is</text><text x="1388" y="1307" class="node-desc on-component" text-anchor="middle">Admin only.</text>
<rect class="shape component" x="993" y="1224.5" width="250" height="111" rx="8"/><text x="1118" y="1249.5" class="node-name on-component" text-anchor="middle">Device store and pairing</text><text x="1118" y="1265.5" class="node-tech on-component" text-anchor="middle">[Component: fleet/devices.py]</text><text x="1118" y="1284.5" class="node-desc on-component" text-anchor="middle">Paired devices, the one-time</text><text x="1118" y="1299.5" class="node-desc on-component" text-anchor="middle">pairing secret, the six-digit</text><text x="1118" y="1314.5" class="node-desc on-component" text-anchor="middle">confirm on the PC, revocation.</text>
<rect class="shape component" x="868" y="830" width="250" height="111" rx="8"/><text x="993" y="855" class="node-name on-component" text-anchor="middle">Relay protocol</text><text x="993" y="871" class="node-tech on-component" text-anchor="middle">[Component: relay/protocol/]</text><text x="993" y="890" class="node-desc on-component" text-anchor="middle">Noise IKpsk2, frames, streams.</text><text x="993" y="905" class="node-desc on-component" text-anchor="middle">Imports nothing else from</text><text x="993" y="920" class="node-desc on-component" text-anchor="middle">cuttlefish.</text>
<rect class="shape component" x="141.33333333333326" y="1217" width="250" height="126" rx="8"/><text x="266.33333333333326" y="1242" class="node-name on-component" text-anchor="middle">Session manager</text><text x="266.33333333333326" y="1258" class="node-tech on-component" text-anchor="middle">[Component: sessions/manager.py,</text><text x="266.33333333333326" y="1273" class="node-tech on-component" text-anchor="middle">tmux.py]</text><text x="266.33333333333326" y="1292" class="node-desc on-component" text-anchor="middle">One tmux session per project on a</text><text x="266.33333333333326" y="1307" class="node-desc on-component" text-anchor="middle">socket of its own. Starts,</text><text x="266.33333333333326" y="1322" class="node-desc on-component" text-anchor="middle">reattaches, relaunches.</text>
<rect class="shape component" x="183" y="1038.5" width="250" height="111" rx="8"/><text x="308" y="1063.5" class="node-name on-component" text-anchor="middle">Terminal bridge</text><text x="308" y="1079.5" class="node-tech on-component" text-anchor="middle">[Component: sessions/terminal.py]</text><text x="308" y="1098.5" class="node-desc on-component" text-anchor="middle">A pty running tmux attach, bridged</text><text x="308" y="1113.5" class="node-desc on-component" text-anchor="middle">to a websocket. The first message</text><text x="308" y="1128.5" class="node-desc on-component" text-anchor="middle">carries the token.</text>
<rect class="shape component" x="723" y="1031" width="250" height="126" rx="8"/><text x="848" y="1056" class="node-name on-component" text-anchor="middle">Claude hook handler</text><text x="848" y="1072" class="node-tech on-component" text-anchor="middle">[Component: fleet/claude_hooks.py,</text><text x="848" y="1087" class="node-tech on-component" text-anchor="middle">hook_files.py]</text><text x="848" y="1106" class="node-desc on-component" text-anchor="middle">Decides a PermissionRequest like a</text><text x="848" y="1121" class="node-desc on-component" text-anchor="middle">stream-json one and holds it until</text><text x="848" y="1136" class="node-desc on-component" text-anchor="middle">a person answers.</text>
<rect class="shape component" x="723" y="1217" width="250" height="96" rx="8"/><text x="848" y="1242" class="node-name on-component" text-anchor="middle">Needs you broker</text><text x="848" y="1258" class="node-tech on-component" text-anchor="middle">[Component: requests.py]</text><text x="848" y="1277" class="node-desc on-component" text-anchor="middle">The inbox of requests agents</text><text x="848" y="1292" class="node-desc on-component" text-anchor="middle">raised, shared with the team view.</text>
<path class="shape ext-db" d="M1020 1553 a98 9 0 0 1 196 0 v63 a98 9 0 0 1 -196 0 z"/><path class="shape-line" d="M1020 1553 a98 9 0 0 0 196 0"/><text x="1118" y="1577" class="node-name" text-anchor="middle">Device store</text><text x="1118" y="1593" class="node-tech" text-anchor="middle">[Container: SQLite]</text><text x="1118" y="1612" class="node-desc" text-anchor="middle">~/.cuttlefish/devices.db</text>
<rect class="elabel-bg" x="1145" y="483" width="114" height="34" rx="3"/>
<text x="1202" y="496" class="elabel" text-anchor="middle">Uses, same origin</text>
<text x="1202" y="510" class="elabel-tech" text-anchor="middle">[HTTP, websocket]</text>
<rect class="elabel-bg" x="950" y="221" width="174" height="34" rx="3"/>
<text x="1037" y="234" class="elabel" text-anchor="middle">Sends encrypted requests to</text>
<text x="1037" y="248" class="elabel-tech" text-anchor="middle">[wss]</text>
<rect class="elabel-bg" x="1022" y="483" width="102" height="34" rx="3"/>
<text x="1073" y="496" class="elabel" text-anchor="middle">Passes bytes to</text>
<text x="1073" y="510" class="elabel-tech" text-anchor="middle">[ws]</text>
<rect class="elabel-bg" x="955" y="783" width="36" height="20" rx="3"/>
<text x="973" y="796" class="elabel" text-anchor="middle">Uses</text>
<rect class="elabel-bg" x="1005.6666666666666" y="776" width="162" height="34" rx="3"/>
<text x="1086.6666666666665" y="789" class="elabel" text-anchor="middle">Calls in process, with an</text>
<text x="1086.6666666666665" y="803" class="elabel" text-anchor="middle">internal token</text>
<rect class="elabel-bg" x="420" y="991" width="156" height="20" rx="3"/>
<text x="498" y="1004" class="elabel" text-anchor="middle">Checks each request with</text>
<rect class="elabel-bg" x="1164.3333333333335" y="991" width="180" height="20" rx="3"/>
<text x="1254.3333333333335" y="1004" class="elabel" text-anchor="middle">Checks relayed requests with</text>
<rect class="elabel-bg" x="1248" y="1177" width="138" height="20" rx="3"/>
<text x="1317" y="1190" class="elabel" text-anchor="middle">Looks the route up in</text>
<rect class="elabel-bg" x="990" y="1177" width="126" height="20" rx="3"/>
<text x="1053" y="1190" class="elabel" text-anchor="middle">Finds the device in</text>
<rect class="elabel-bg" x="1006" y="1440" width="108" height="34" rx="3"/>
<text x="1060" y="1453" class="elabel" text-anchor="middle">Reads and writes</text>
<text x="1060" y="1467" class="elabel-tech" text-anchor="middle">[SQLite]</text>
<rect class="elabel-bg" x="52" y="1084" width="108" height="20" rx="3"/>
<text x="106" y="1097" class="elabel" text-anchor="middle">Starts and stops</text>
<rect class="elabel-bg" x="180" y="991" width="126" height="20" rx="3"/>
<text x="243" y="1004" class="elabel" text-anchor="middle">Opens a terminal on</text>
<rect class="elabel-bg" x="228" y="1177" width="78" height="20" rx="3"/>
<text x="267" y="1190" class="elabel" text-anchor="middle">Attaches to</text>
<rect class="elabel-bg" x="1548" y="476" width="144" height="48" rx="3"/>
<text x="1620" y="489" class="elabel" text-anchor="middle">Hook script posts to</text>
<text x="1620" y="503" class="elabel" text-anchor="middle">/api/hooks/claude-code</text>
<text x="1620" y="517" class="elabel-tech" text-anchor="middle">[HTTP, hook token]</text>
<rect class="elabel-bg" x="726" y="991" width="120" height="20" rx="3"/>
<text x="786" y="1004" class="elabel" text-anchor="middle">Hands each hook to</text>
<rect class="elabel-bg" x="720" y="1177" width="126" height="20" rx="3"/>
<text x="783" y="1190" class="elabel" text-anchor="middle">Raises a request in</text>
<rect class="shape person" x="30" y="1667" width="22" height="13" rx="3"/><text x="59" y="1677" class="legend-t" text-anchor="start">Person</text><rect class="shape component" x="118.8" y="1667" width="22" height="13" rx="3"/><text x="147.8" y="1677" class="legend-t" text-anchor="start">Component</text><rect class="shape ext" x="226.5" y="1667" width="22" height="13" rx="3"/><text x="255.5" y="1677" class="legend-t" text-anchor="start">Outside the system</text><rect class="boundary" x="390.9" y="1667" width="22" height="13" rx="3"/><text x="419.9" y="1677" class="legend-t" text-anchor="start">Boundary</text>
<text x="30" y="1703" class="note" text-anchor="start">A device is trusted only after its first transport message decrypts, and a device the owner has not confirmed on the PC is served nothing (ADR-0037, ADR-0039). A held hook is released at shutdown, so uvicorn is not left waiting on a person (ADR-0040).</text>
</svg>
