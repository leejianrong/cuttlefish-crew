[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuttlefish"
version = "0.1.0"
description = "A long-running, unattended task assistant, built on satay-runtime for durability and delegating coding subtasks to kopicode."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jian", email = "leejianrong2@gmail.com" }]
keywords = [
    "agent",
    "durable-execution",
    "unattended",
    "coding-assistant",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
# satay is pinned, not floated (docs/QUESTIONS.md Q19) — this project tracks a
# specific satay release deliberately, since it's satay's first real external
# consumer and a floating dependency would make "which satay version did this
# behave against" an open question on every bug report. The `[studio]` extra
# pulls in FastAPI/uvicorn for `satay.control.run_app` (ADR-0046) — `cuttlefish
# run --steerable`'s own control API (ADR-0008) needs it unconditionally, not as
# an opt-in extra of cuttlefish's own. openai backs the default
# real LlmProvider, OpenRouterLlmProvider, over OpenRouter's OpenAI-compatible
# endpoint (QUESTIONS.md Q11's "an OpenAI-compatible endpoint"); anthropic backs
# ClaudeLlmProvider for a direct Anthropic credential. Both floated, since they're
# well-behaved, actively maintained SDKs and cuttlefish has no reason to pin its
# own external LLM dependencies as tightly as its own runtime. python-dotenv
# loads `.env` at CLI startup so an operator's credential doesn't need to be
# exported into the shell by hand. e2b backs E2bSandboxProvider (ADR-0002: the
# only sandbox backend this project builds), floated for the same reason as
# anthropic/openai — a well-behaved, actively maintained SDK cuttlefish doesn't
# own and has no reason to pin as tightly as satay. cryptography backs
# SecretsStore's Fernet encryption (ADR-0006) — floated for the same reason,
# a well-audited, actively maintained SDK this project has no standing to pin
# tightly, since it owns no cryptographic primitives of its own. mcp backs
# `cuttlefish mcp` (KAN-1764, ADR-0020) — the official Model Context Protocol
# SDK, floated for the identical "well-behaved, actively maintained, not
# cuttlefish's own to pin tightly" reason as anthropic/openai/e2b.
dependencies = [
    "satay[studio]==0.2.0",
    "anthropic>=0.40",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "e2b>=2.0",
    "cryptography>=42",
    "mcp>=2.2.0",
    "httpx>=0.27",
]

[project.scripts]
cuttlefish = "cuttlefish.cli:main"

[project.urls]
Homepage = "https://github.com/leejianrong/cuttlefish-crew"
Repository = "https://github.com/leejianrong/cuttlefish-crew"

# uv dev dependency group (PEP 735); installed by default on `uv sync`.
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cuttlefish"]

[tool.hatch.build.targets.sdist]
include = ["src/cuttlefish", "README.md", "LICENSE"]

# ---------------------------------------------------------------------------
# Ruff — lint + format, matching satay-runtime's own configuration exactly
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Markdown here is hand-written prose (README, ADRs) with deliberate line
# breaks and table alignment — see satay-runtime's own pyproject.toml for why
# a Python formatter should not reflow it.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------------------------------------------------------------------------
# mypy — strict over the whole package
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cuttlefish"]
warn_unused_configs = true
show_error_codes = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "requires_kopicode: needs a real kopicode binary on PATH; skips itself otherwise",
    "requires_live_credential: needs a real OPENROUTER_API_KEY or ANTHROPIC_API_KEY; skips itself otherwise",
    "requires_e2b_credential: needs a real E2B_API_KEY, costs real money; skips itself otherwise",
    "requires_docker: needs a local docker daemon on PATH; skips itself otherwise",
    "requires_claude_code: needs a real claude binary on PATH; skips itself otherwise",
    "requires_claude_code_live: needs a real, authenticated claude binary and costs real money; opt-in via CUTTLEFISH_TEST_CLAUDE_CODE_LIVE=1, never runs otherwise",
    "requires_codex: needs a real codex binary on PATH; skips itself otherwise",
    "requires_codex_live: needs a real, authenticated codex binary and costs real money; opt-in via CUTTLEFISH_TEST_CODEX_LIVE=1, never runs otherwise",
]

[tool.coverage.run]
source = ["cuttlefish"]
branch = true
