name: Deploy relay

# CUT-141 (ADR-0043). The hosted relay reaches the DigitalOcean Droplet only through this pipeline:
#
#   a PR runs the checks (ci.yml); after a merge to main and a green CI run, this builds the image,
#   pushes it to GHCR, records its digest, smoke-tests that digest, and then a deploy job in the
#   protected `production` environment (required reviewers, set in the repository settings) runs the
#   Droplet's one allowed command over a key restricted to it. The Droplet health-checks the new
#   container and puts the previous one back if it is not healthy.
#
# Nothing deploys until the repository variable DEPLOY_ENABLED is "true" and the `production`
# environment has its variables and secrets (docs-site/hosted-relay.md). The deploy key is an
# environment secret, never in the repository.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      digest:
        description: >
          Deploy this image digest again (sha256:...), for example to go back to an earlier release.
          It goes through the same approval.
        required: true
        type: string

# One deploy at a time, and never cancel one that is running; a newer merge replaces a waiting one.
concurrency:
  group: deploy-relay
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/leejianrong/cuttlefish-relay

jobs:
  build:
    name: Build, push and smoke-test the image
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/relay/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "$IMAGE@$DIGEST" | tee relay-image.txt
          {
            echo "### Relay image"
            echo
            echo "- commit \`$SHA\`"
            echo "- image \`$IMAGE@$DIGEST\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-image-digest
          path: relay-image.txt
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The very bytes that will be deployed, pulled back by digest, not the local build.
      - name: Smoke-test the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          CUTTLEFISH_SMOKE_IMAGE="$IMAGE@$DIGEST" uv run pytest tests/smoke/test_relay_image.py tests/smoke/test_caddy_gate.py -q

  deploy:
    name: Deploy to the Droplet
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RELAY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ./.github/actions/deploy-relay
        with:
          image: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          public-url: ${{ vars.RELAY_PUBLIC_URL }}

  redeploy:
    name: Deploy an earlier digest
    if: github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RELAY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the digest
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::not a sha256 digest"; exit 1; }
      - uses: ./.github/actions/deploy-relay
        with:
          image: ${{ env.IMAGE }}@${{ inputs.digest }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          public-url: ${{ vars.RELAY_PUBLIC_URL }}
