name: Docs

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; new pushes cancel the previous run.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs site (zensical --strict)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install zensical
      - name: zensical build --strict
        run: zensical build --clean --strict
      - name: Add the marketing landing page at the site root
        run: cp -r marketing/. site/
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
