<!doctype html>
<html><head><meta charset="utf-8"><title>Example dashboard</title>
<meta name="cuttlefish:artifact" content="dashboard">
<meta name="description" content="Tests passed per day as bars.">
<style>
body{margin:0;padding:20px;font:16px system-ui,sans-serif;background:#10141c;color:#eef}
svg{width:100%;max-width:480px;height:auto}
</style></head><body>
<h1>Tests passed</h1><svg id="c" viewBox="0 0 300 120"></svg>
<script>
var data=[{d:"Mon",v:40},{d:"Tue",v:55},{d:"Wed",v:48},{d:"Thu",v:70}],h="";
data.forEach(function(p,k){h+='<rect x="'+(20+k*70)+'" y="'+(100-p.v)+'" width="40" height="'+p.v+'" fill="#6aa7ff"/>'+
'<text x="'+(40+k*70)+'" y="115" fill="#eef" font-size="10" text-anchor="middle">'+p.d+'</text>'});
document.getElementById("c").innerHTML=h;
</script></body></html>
