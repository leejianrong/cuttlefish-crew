<!doctype html>
<html><head><meta charset="utf-8"><title>Example slides</title>
<meta name="cuttlefish:artifact" content="slides">
<meta name="description" content="Two slides with next and previous buttons.">
<style>
body{margin:0;font:18px system-ui,sans-serif;background:#10141c;color:#eef}
.slide{display:none;min-height:80vh;padding:8vw;box-sizing:border-box}
.slide.on{display:block}
h1{font-size:2em;margin:0 0 .5em}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;justify-content:center;padding:10px}
button{font:inherit;padding:8px 18px;border-radius:8px;border:0;background:#6aa7ff;color:#001}
</style></head><body>
<section class="slide on"><h1>What we built</h1><p>One idea per slide.</p></section>
<section class="slide"><h1>What is next</h1><p>Use arrow keys or the buttons.</p></section>
<nav><button id="p">Previous</button><span id="n"></span><button id="x">Next</button></nav>
<script>
var s=document.querySelectorAll(".slide"),i=0;
function go(d){i=Math.max(0,Math.min(s.length-1,i+d));
s.forEach(function(e,k){e.className="slide"+(k==i?" on":"")});
document.getElementById("n").textContent=(i+1)+" / "+s.length}
document.getElementById("p").onclick=function(){go(-1)};
document.getElementById("x").onclick=function(){go(1)};
addEventListener("keydown",function(e){if(e.key=="ArrowRight")go(1);if(e.key=="ArrowLeft")go(-1)});
go(0);
</script></body></html>
